name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saas_admin
          POSTGRES_PASSWORD: securepassword
          POSTGRES_DB: saas_gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saas_admin"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://saas_admin:securepassword@localhost:5432/saas_gateway
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
          
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
        
      - name: Run tests
        working-directory: ./backend
        run: pytest -q
